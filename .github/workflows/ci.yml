name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest -m "not live" --cov --cov-branch --cov-report=term-missing

  docs:
    name: docs (mkdocs --strict build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  packaging:
    name: packaging (ubuntu, wheel install smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"

      - name: Build wheel
        run: uv build

      - name: Install wheel into a fresh virtual environment and smoke test
        run: |
          python -m venv /tmp/agentic-evalkit-smoke
          /tmp/agentic-evalkit-smoke/bin/pip install dist/*.whl
          /tmp/agentic-evalkit-smoke/bin/agentic-evalkit --help

  audit:
    name: audit (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # pip-audit evaluates each requirement's environment marker against the
    # interpreter it runs on and skips non-matching entries, so one run misses
    # platform- and version-specific packages. Audit the supported matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}

      # requirements-audit.txt is generated here and never committed: this
      # export of uv.lock is the only copy pip-audit reads, so a tracked one
      # would be a second rendering of the lock that nothing keeps in sync.
      - name: Export locked dependencies
        run: uv export --locked --all-groups --all-extras --no-emit-project --format requirements.txt -o requirements-audit.txt

      - name: pip-audit
        run: uvx --python ${{ matrix.python-version }} pip-audit==2.10.1 -r requirements-audit.txt --disable-pip

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    # Only this job needs to read the PR's commit list, and only on
    # pull_request events; everything else keeps the default grant.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          # Required for pull_request scans since gitleaks-action v2.3.0.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
