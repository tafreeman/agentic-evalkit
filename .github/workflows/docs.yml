# Deploy the docs site to GitHub Pages.
#
# Triggered by a successful `CI` run on main rather than by the push itself, so a
# commit that fails its own test/lint/type gate is never the commit that gets
# published — a push-triggered deploy would race CI and could publish a commit CI
# was in the middle of rejecting.
name: docs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one concurrent deployment. Never cancel one in progress: an
# interrupted deploy can leave the published site in a partial state, and the
# next successful run is only moments behind anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # `workflow_run` fires on failed runs too, so the conclusion has to be checked
    # explicitly — without this the job would publish the docs of a commit whose
    # tests just failed.
    #
    # Only deploy commits that CI ran for a push to this repository. The
    # `branches: [main]` filter above matches the triggering run's head branch,
    # which a fork PR controls (a fork's own `main` matches), so without this a
    # fork PR's code would be checked out at `head_sha`, built, and deployed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Check out the exact commit CI passed on, not whatever main points at
          # now. `workflow_run` events carry the triggering run's SHA, and main can
          # move between CI finishing and this job starting.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.11"

      - run: uv sync --group dev

      - run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages write and the OIDC token are granted only to the job that runs no
    # repository code.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
