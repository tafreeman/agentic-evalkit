[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-evalkit"
version = "0.4.0"
description = "Evaluate agentic systems with reproducible, evidence-first grading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Andy Freeman", email = "tandfreeman@gmail.com" }]
keywords = ["evaluation", "agents", "benchmarking", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2,<3",
  "typer>=0.12,<1",
  "rich>=13,<16",
  "pyyaml>=6,<7",
  "huggingface-hub>=0.20,<2",
  "httpx>=0.28.1,<1",
  "jinja2>=3,<4",
]

[project.urls]
Changelog = "https://github.com/tafreeman/agentic-evalkit/blob/main/CHANGELOG.md"
Homepage = "https://github.com/tafreeman/agentic-evalkit"
Issues = "https://github.com/tafreeman/agentic-evalkit/issues"
Repository = "https://github.com/tafreeman/agentic-evalkit"
Security = "https://github.com/tafreeman/agentic-evalkit/blob/main/SECURITY.md"

[project.scripts]
agentic-evalkit = "agentic_evalkit.cli:app"

[project.optional-dependencies]
swebench = ["swebench>=4.1,<5", "docker>=7.1,<8"]
# ADR-0025. The Claude Agent SDK is how a Claude *subscription* sign-in is
# spent programmatically -- there is no wire contract to reach it with the
# httpx client this package already has. It is an extra, not a dependency,
# because grading Claude is one target among five and because the SDK
# additionally needs the Claude Code CLI on PATH, a machine-level
# prerequisite pip cannot express.
claude = [
    "claude-agent-sdk>=0.2,<1",
]
# ADR-0022. `mlflow-skinny` rather than `mlflow`: the bridge only ever calls
# the tracking client and the genai scorer surface, both of which skinny
# provides, while the full distribution additionally pulls scikit-learn,
# scipy, pyarrow and a web server that no export path here touches. Because
# `mlflow` itself depends on `mlflow-skinny`, this pin is already satisfied
# for anyone who has the full package installed -- it narrows what we
# require without constraining what a user may have.
mlflow = ["mlflow-skinny>=3,<4"]
# The floor is an API boundary, not a guess. This bridge builds its root
# observation with `start_observation(as_type="evaluator")`, which landed in
# 3.3.1 -- 3.3.0 and every earlier 3.x exposes only `start_span` /
# `start_generation`, so `pip install agentic-evalkit[langfuse]` against a
# project already pinning one of those would resolve happily and then raise
# AttributeError on the first export rather than at install time. The `<5`
# ceiling is the usual major-version guard and admits all of 4.x, which is
# what the lockfile resolves and what CI type-checks against. The surface
# this module calls (`start_observation`, `create_score`, `flush`, span
# `.end`/`.id`/`.trace_id`) is unchanged across 3.3.1 and 4.x, which is why the range
# spans the major rather than being pinned to one side of it.
langfuse = ["langfuse>=3.3.1,<5"]

[dependency-groups]
dev = [
  "build>=1,<2",
  "mkdocs>=1,<2",
  "mkdocs-material>=9,<10",
  "mypy>=1,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "pytest-repeat>=0.9,<1",
  "ruff>=0.6,<1",
  "types-pyyaml>=6,<7",
  # The two integration extras are installed for development so the bridge
  # tests exercise the real client libraries rather than a stand-in of what
  # we imagine their APIs to be, and so mypy type-checks the calls into them
  # (both ship py.typed). The MLflow bridge is tested against a local
  # tracking directory with no server and no network; the Langfuse bridge
  # has no offline mode, so it is tested against its declared protocol.
  # Both mirror the extras' own ranges deliberately: a development
  # environment resolving a version the extra forbids would type-check and
  # test against a surface no user can actually install.
  "mlflow-skinny>=3,<4",
  "langfuse>=3.3.1,<5",
  # Same reasoning, for the `claude` extra: the target tests replay the SDK's
  # own message dataclasses rather than a stand-in of what we imagine them to
  # be, so an upstream field rename fails this suite instead of passing it and
  # failing in production. Mirrors the extra's range for the same reason.
  "claude-agent-sdk>=0.2,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_evalkit"]

[tool.pytest.ini_options]
# --cov-config is pinned explicitly (not left to coverage.py's own file
# auto-discovery): without it, pytest-cov's internal parallel-mode data file
# and coverage.py's combine-time accumulator can each resolve the branch
# setting differently on some platforms, crashing with
# "coverage.exceptions.DataError: Can't combine ... coverage data with ...
# data" -- see pytest-dev/pytest-cov#479 and nedbat/coveragepy#512.
addopts = "--strict-config --strict-markers -m 'not live' --cov-config=pyproject.toml"
asyncio_mode = "auto"
# Default collection is scoped to tests/ so the benchmark fixture repositories
# under examples/ are never collected as this package's own tests: their
# modules import their fixture-local `src` package and only resolve when a
# graded run executes them inside their own working directory.
testpaths = ["tests"]
markers = [
  "integration: component integration tests",
  "live: opt-in network tests confined to tests/live",
]

[tool.coverage.run]
branch = true
source = ["agentic_evalkit"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
# reports/ holds pinned run evidence: the committed harness is the exact code
# that produced the committed outputs, so it is never edited after the run —
# not even for lint. Library standards apply to src/ and tests/, not evidence.
extend-exclude = [
  "reports",
  # Benchmark fixture repositories are graded material, not library code: they
  # deliberately contain the defects, mutants, and gold solutions a run is
  # scored against. Linting or reformatting them would change what the
  # benchmark measures. Tooling at the baseline root stays linted.
  "examples/*/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S", "B", "A", "C4", "SIM", "TCH", "RUF"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic v2 needs a field's annotated type to be a real, importable object
# at class-definition time to build its validators -- unlike a plain function
# signature, moving a FrozenModel/BaseModel field's type import behind
# `if TYPE_CHECKING:` breaks model construction, it doesn't just satisfy the
# linter. Every wire model in this package subclasses FrozenModel
# (agentic_evalkit.models.base), so TC001/002/003 must treat both as
# runtime-evaluated and never suggest moving their field-type imports.
runtime-evaluated-base-classes = ["agentic_evalkit.models.base.FrozenModel", "pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion mechanism *is* `assert`; S101 firing on every test
# assertion is noise, not a finding. S105 in tests/ is exclusively deliberately-
# fake secret fixtures used to exercise redaction (e.g. tests/unit/test_manifest.py's
# _HOOK_SECRET, tests/integration/test_runner.py's _PLANTED_TOKEN) -- their entire
# purpose is verifying a fake secret gets redacted, never a real credential.
"tests/**" = ["S101", "S105"]
# DatasetNotFound, DatasetAccessDenied, TargetFailure, TargetTimeout, and their
# siblings are stable, documented public API (errors.py __all__, referenced by
# docs/guides/providers.md). Renaming to satisfy N818's Error-suffix convention
# is a breaking change for any caller doing `except DatasetNotFound:` -- out of
# scope for a lint-hygiene pass; revisit at a deliberate major-version bump.
"src/agentic_evalkit/errors.py" = ["N818"]
# ArtifactStoreLimitExceeded: same rationale (public API, artifacts.py __all__).
"src/agentic_evalkit/artifacts.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentic_evalkit"]

# ADR-0022: the integration extras are optional by design, so a contributor
# who installs only the base package must still be able to run mypy. Both
# libraries ship py.typed, so when they ARE installed (as in the dev group
# and in CI) their real types are used and the bridge is checked against
# them properly; this override only stops the missing-import error on a
# machine without them, and never silences a genuine type error.
[[tool.mypy.overrides]]
module = ["mlflow.*", "langfuse.*"]
ignore_missing_imports = true

# ADR-0025: same reasoning for the `claude` extra. claude-agent-sdk ships
# py.typed, so when it IS installed its real types check the target properly;
# this override only stops the missing-import error without it.
[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*"]
ignore_missing_imports = true
